name: Xiaomi MZTU0 patch

on:
  push:
    branches: [fix/xiaomi-mztu0-safe-support]
    paths: [".github/workflows/xiaomi-mztu0-patch.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/xiaomi-mztu0-safe-support
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Apply Xiaomi MiTV-MZTU0 safe support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly 1 match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "app/src/io/freemytv/HomeMode.java",
              '        "mitv.service", "com.mi.bluetooth", "com.mitv.livetv.ci_mediatek", "com.xiaomi.tvqs.overseas",\n        "com.mitv.tvlock", "com.xiaomi.mitv.updateservice", "com.xiaomi.android.tvsetup.partnercustomizer",',
              '        "mitv.service", "com.mi.bluetooth", "com.mitv.livetv.ci_mediatek", "com.mitv.livetv", "com.xiaomi.tvqs.overseas",\n        "com.mitv.tvlock", "com.xiaomi.mitv.updateservice", "com.mitv.setup", "com.xiaomi.mitv.scenemode",\n        "com.xiaomi.android.tvsetup.partnercustomizer",'
          )

          replace_once(
              "app/src/io/freemytv/HomeApps.java",
              '            "com.smartdevice.livetv", "com.mediatek.tv.oneworld.tvcenter", "com.amazon.tv.livetv", "com.amazon.mediatek.livetv"};',
              '            "com.smartdevice.livetv", "com.mediatek.tv.oneworld.tvcenter", "com.mitv.livetv",\n            "com.amazon.tv.livetv", "com.amazon.mediatek.livetv"};'
          )

          replace_once(
              "app/AndroidManifest.xml",
              '        <package android:name="com.mediatek.tv.oneworld.tvcenter" />\n        <!-- HY300 projectors:',
              '        <package android:name="com.mediatek.tv.oneworld.tvcenter" />\n        <package android:name="com.mitv.livetv" />\n        <!-- HY300 projectors:'
          )

          # Safety assertions: protect-only patch; do not add Xiaomi packages to DEBLOAT.
          mode = Path("app/src/io/freemytv/HomeMode.java").read_text()
          for pkg in ("com.mitv.livetv", "com.mitv.setup", "com.xiaomi.mitv.scenemode"):
              if pkg not in mode:
                  raise SystemExit(f"missing protected package {pkg}")
          PY
      - name: Android build check
        run: tools/check.sh android
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/xiaomi-mztu0-patch.yml
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/io/freemytv/HomeMode.java app/src/io/freemytv/HomeApps.java app/AndroidManifest.xml .github/workflows/xiaomi-mztu0-patch.yml
          git commit -m "fix: add safe Xiaomi MiTV-MZTU0 support"
          git push origin HEAD:fix/xiaomi-mztu0-safe-support
